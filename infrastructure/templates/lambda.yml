AWSTemplateFormatVersion: "2010-09-09"
Description: "Lambda functions for Budget Bliss backend"

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:
  CategorizeTransactionsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "BudgetBliss-CategorizeTransactions-${Environment}"
      Handler: index.handler
      Runtime: nodejs18.x
      Timeout: 15
      MemorySize: 256
      Role: arn:aws:iam::923102105976:role/BudgetBlissLambdaRole
      Code:
        S3Bucket: budgetbliss-lambda-code
        S3Key: categorize-transactions.zip
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !Sub "BudgetBliss-Transactions-${Environment}"
          BUDGETS_TABLE: !Sub "BudgetBliss-Budgets-${Environment}"

  GenerateTipsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "BudgetBliss-GenerateTips-${Environment}"
      Handler: index.handler
      Runtime: nodejs18.x
      Timeout: 30
      MemorySize: 256
      Role: arn:aws:iam::923102105976:role/BudgetBlissLambdaRole
      Code:
        S3Bucket: budgetbliss-lambda-code
        S3Key: generate-tips.zip
      Environment:
        Variables:
          OPENAI_API_KEY: "<YOUR_OPENAI_API_KEY>"
          TIPS_TABLE: !Sub "BudgetBliss-Tips-${Environment}"

Outputs:
  CategorizeTransactionsFunctionArn:
    Value: !GetAtt CategorizeTransactionsFunction.Arn
  GenerateTipsFunctionArn:
    Value: !GetAtt GenerateTipsFunction.Arn
