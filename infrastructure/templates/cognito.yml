AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cognito user pool for BudgetBliss. This is the one piece of infrastructure
  serverless.yml doesn't provision itself - it only reads COGNITO_USER_POOL_ID/
  COGNITO_CLIENT_ID from the environment (see backend/serverless.yml). Everything
  else (DynamoDB, Lambda, API Gateway, SNS, EventBridge, CloudWatch, S3) is
  managed by the Serverless Framework - see infrastructure/README.md.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  BudgetBlissUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "BudgetBlissUserPool-${Environment}"
      # Only email is auto-verified. Auto-verifying phone_number requires an SNS
      # role (SmsConfiguration.SnsCallerArn) that isn't set up here - add one if
      # SMS verification is needed later.
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: phone_number
          Required: true
          Mutable: true
        - Name: preferred_username
          Mutable: true

  BudgetBlissUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "BudgetBlissAppClient-${Environment}"
      GenerateSecret: false
      UserPoolId: !Ref BudgetBlissUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # Grants temporary AWS credentials to signed-in users for direct AWS SDK calls
  # (e.g. S3 uploads). The frontend currently only calls BudgetBliss's own REST
  # API (see frontend/src/utils/apiClient.js), not AWS services directly, so this
  # isn't used yet and has no IAM roles attached - add an
  # AWS::Cognito::IdentityPoolRoleAttachment if that changes. Safe to remove if
  # you don't anticipate needing it.
  BudgetBlissIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "BudgetBlissIdentityPool-${Environment}"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref BudgetBlissUserPoolClient
          ProviderName: !GetAtt BudgetBlissUserPool.ProviderName

Outputs:
  UserPoolId:
    Value: !Ref BudgetBlissUserPool
  UserPoolClientId:
    Value: !Ref BudgetBlissUserPoolClient
  IdentityPoolId:
    Value: !Ref BudgetBlissIdentityPool
